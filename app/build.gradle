plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.e2player'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Duas apps a partir do mesmo código: muda só a fonte dos canais
    flavorDimensions.add("fonte")
    productFlavors {
        enigma2 {
            dimension "fonte"
            applicationId "pt.e2player"
            resValue "string", "app_name", "e2player"
            buildConfigField "boolean", "TVH", "false"
        }
        tvheadend {
            dimension "fonte"
            applicationId "pt.tvhplayer"
            resValue "string", "app_name", "TVH Player"
            buildConfigField "boolean", "TVH", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-decoder:1.4.1'
    // descodificador FFmpeg (MP2, MP3, AAC, AC-3, E-AC-3) compilado pelo workflow em app/libs
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
}
